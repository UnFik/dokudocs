name: dokudocs

# Every ${VAR:-default} can be overridden from the shell or a root .env file.
# Secrets (GOOGLE_*, OPENAI_API_KEY) default to empty; JWT_SECRET and COLLAB_SERVICE_SECRET are dev-only values.
#
#   make dev                       # db, redis, migrate, api, collab, frontend
#   open http://localhost:5173
#
# Without make: docker compose -f docker-compose.dev.yaml up --build
#
# The browser only talks to the frontend (:5173): it proxies /api to the API and /collab to the collaboration service.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dokudocs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dokudocs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dokudocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dokudocs-redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: dokudocs-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  migrate:
    build:
      context: ./backend
      target: dev
    container_name: dokudocs-migrate
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dokudocs}?sslmode=disable
    volumes:
      - ./backend:/app
      - go_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    command: go run ./cmd/migrate up
    restart: "no"

  api:
    build:
      context: ./backend
      target: dev
    container_name: dokudocs-api
    working_dir: /app
    environment:
      APP_ADDR: ${APP_ADDR:-:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dokudocs}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      # Locally, reach the API by another name than the app uses (the app is on localhost,
      # so http://127.0.0.1:8080 is a different origin). Empty keeps HTML pages closed.
      CONTENT_ORIGIN: ${CONTENT_ORIGIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Dev-only sealing key; production must set its own (openssl rand -base64 32).
      AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      AI_ALLOW_PRIVATE_HOSTS: ${AI_ALLOW_PRIVATE_HOSTS:-true}
      # First boot only: seeds the AI provider settings. After that the database wins.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_ANSWER_MODEL: ${RAG_ANSWER_MODEL:-gpt-5-mini}
      RAG_REQUEST_TIMEOUT: ${RAG_REQUEST_TIMEOUT:-120s}
      AI_RUN_TIMEOUT: ${AI_RUN_TIMEOUT:-30m}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-24h}
      # Mail goes to Mailpit (http://localhost:8025), nothing leaves the machine.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Dokudocs <no-reply@localhost>}
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
      FIREBASE_WEB_SENDER_ID: ${FIREBASE_WEB_SENDER_ID:-}
      FIREBASE_WEB_VAPID_KEY: ${FIREBASE_WEB_VAPID_KEY:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-10}
      RATE_LIMIT_GOOGLE_START_PER_MIN: ${RATE_LIMIT_GOOGLE_START_PER_MIN:-20}
      RATE_LIMIT_GOOGLE_CALLBACK_PER_MIN: ${RATE_LIMIT_GOOGLE_CALLBACK_PER_MIN:-30}
      RATE_LIMIT_INVITE_SEND_PER_MIN: ${RATE_LIMIT_INVITE_SEND_PER_MIN:-10}
      RATE_LIMIT_INVITE_LOOKUP_PER_MIN: ${RATE_LIMIT_INVITE_LOOKUP_PER_MIN:-30}
      # Uploaded files live in their own volume, not in the bind-mounted source tree.
      ASSET_DIR: /var/lib/dokudocs/assets
      READ_TIMEOUT: ${READ_TIMEOUT:-5s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-10s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      COLLAB_SERVICE_SECRET: ${COLLAB_SERVICE_SECRET:-dev-collab-secret}
      COLLAB_SERVICE_URL: http://collab:1234
      # PDF export is off while this is empty: set it empty (not unset) to turn it off.
      PDF_RENDER_URL: ${PDF_RENDER_URL-http://gotenberg:3000}
      PDF_RENDER_TIMEOUT: ${PDF_RENDER_TIMEOUT:-30s}
      PDF_RENDER_MAX_BYTES: ${PDF_RENDER_MAX_BYTES:-8388608}
      PDF_RENDER_CONCURRENCY: ${PDF_RENDER_CONCURRENCY:-2}
      RATE_LIMIT_EXPORT_PDF_PER_MIN: ${RATE_LIMIT_EXPORT_PDF_PER_MIN:-6}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - assets:/var/lib/dokudocs/assets
      - go_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    # The API reaches the converter on its own network; nothing else is on it.
    networks:
      - default
      - render
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: go run ./cmd/server

  # Prints a document's page to PDF (docs/deployment.md, "PDF export"). Only the API can
  # reach it: its network has no route out, it publishes no port, and the page it is sent
  # may load nothing and run nothing. Several layers say the same thing on purpose.
  gotenberg:
    image: gotenberg/gotenberg:8.39.0-chromium
    restart: unless-stopped
    command:
      - gotenberg
      # Longer than PDF_RENDER_TIMEOUT, so the API's own limit answers first.
      - --api-timeout=40s
      - --api-body-limit=12MB
      - --api-disable-download-from=true
      - --chromium-disable-javascript=true
      - --chromium-deny-private-ips=true
      - --chromium-allow-list=^(data:|about:blank|file:///tmp/)
      - --chromium-max-queue-size=4
      - --chromium-restart-after=50
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    networks:
      - render
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  collab:
    build:
      context: .
      dockerfile: collab/Dockerfile
    container_name: dokudocs-collab
    restart: unless-stopped
    environment:
      COLLAB_BACKEND_URL: http://api:8080
      COLLAB_SERVICE_SECRET: ${COLLAB_SERVICE_SECRET:-dev-collab-secret}
      COLLAB_PORT: "1234"
      REDIS_URL: redis://redis:6379/1
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: dokudocs-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
      COLLAB_PROXY_TARGET: ${COLLAB_PROXY_TARGET:-http://collab:1234}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # node_modules lives in this volume, not in the bind-mounted source, so it
      # keeps the packages of the image it was created from. Installing on every
      # start brings it up to bun.lock after a pull adds a dependency.
      - /app/node_modules
    depends_on:
      - api
      - collab
    command: sh -c "bun install --frozen-lockfile && exec bun run dev --host"

networks:
  # No route out: the PDF converter is on this network, and only the API joins it.
  render:
    internal: true

# Reuse the volumes created by backend/docker-compose.yaml so existing dev data carries over.
volumes:
  assets:
  postgres_data:
    name: backend_postgres_data
  go_cache:
    name: backend_go_cache
  go_build_cache:
    name: backend_go_build_cache
