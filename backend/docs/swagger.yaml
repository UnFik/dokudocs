basePath: /api/v1
definitions:
  backend_internal_domain_model.Document:
    properties:
      author:
        $ref: '#/definitions/backend_internal_domain_model.UserAuthor'
      authorId:
        type: string
      categories:
        items:
          type: string
        type: array
      category:
        description: Primary / first category
        type: string
      content:
        type: string
      contentJSON:
        description: ContentJSON is the editor document as ProseMirror JSON; only
          the single-document read fills it.
        items:
          type: integer
        type: array
      createdAt:
        type: string
      deletedAt:
        type: string
      deletedBy:
        type: string
      deletedByUser:
        $ref: '#/definitions/backend_internal_domain_model.UserAuthor'
      id:
        type: string
      isDraft:
        type: boolean
      isShared:
        type: boolean
      isStarred:
        type: boolean
      lastViewedAt:
        type: string
      projectId:
        type: string
      projectName:
        type: string
      replacementId:
        description: |-
          ReplacementID names the record the body's collaboration room writes to; only a
          restore changes it. Only the single-document read fills it.
        type: string
      starredAt:
        type: string
      tags:
        items:
          type: string
        type: array
      thumbnail:
        type: string
      thumbnailDark:
        type: string
      thumbnailPreview:
        type: string
      thumbnailPreviewDark:
        type: string
      title:
        type: string
      type:
        description: markdown, dbdiagram, mermaid, architecture
        type: string
      updatedAt:
        type: string
      updatedBy:
        allOf:
        - $ref: '#/definitions/backend_internal_domain_model.UserAuthor'
        description: UpdatedBy is the person whose edit was stored last; nil before
          the first edit. Only the single-document read fills it.
      viewCount:
        type: integer
      visibility:
        description: workspace, private, public_link, inherit
        type: string
      workspaceId:
        type: string
    type: object
  backend_internal_domain_model.DocumentAccess:
    properties:
      accessLevel:
        description: owner, edit, comment, view
        type: string
      createdAt:
        type: string
      documentId:
        type: string
      user:
        $ref: '#/definitions/backend_internal_domain_model.UserAuthor'
      userId:
        type: string
    type: object
  backend_internal_domain_model.DocumentRestoreResult:
    properties:
      bodyVersion:
        type: integer
      documentId:
        type: string
      replacementId:
        description: ReplacementID is the record the restore made; editors reopen
          the document on it.
        type: string
      revisionId:
        type: string
      sourceRevisionId:
        type: string
    type: object
  backend_internal_domain_model.DocumentRevision:
    properties:
      authorId:
        type: string
      bodyVersion:
        type: integer
      content:
        type: string
      contentJSON:
        items:
          type: integer
        type: array
      createdAt:
        type: string
      documentId:
        type: string
      id:
        type: string
      isNamed:
        type: boolean
      title:
        type: string
      updatedAt:
        type: string
      versionNumber:
        type: integer
    type: object
  backend_internal_domain_model.Project:
    properties:
      categories:
        items:
          $ref: '#/definitions/backend_internal_domain_model.ProjectCategory'
        type: array
      categoryColors:
        additionalProperties:
          type: string
        type: object
      categoryNames:
        items:
          type: string
        type: array
      colorBadge:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      deletedAt:
        type: string
      description:
        type: string
      documentCount:
        type: integer
      id:
        type: string
      isStarred:
        type: boolean
      logoUrl:
        type: string
      name:
        type: string
      role:
        description: User's role in this project (if direct member)
        type: string
      starredAt:
        type: string
      updatedAt:
        type: string
      visibility:
        type: string
      workspaceId:
        type: string
    type: object
  backend_internal_domain_model.ProjectCategory:
    properties:
      colorId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      projectId:
        type: string
      sortOrder:
        type: integer
    type: object
  backend_internal_domain_model.ProjectMember:
    properties:
      createdAt:
        type: string
      id:
        description: projectID:userID composite or string
        type: string
      projectId:
        type: string
      role:
        description: '''manager'', ''editor'', ''viewer'''
        type: string
      user:
        $ref: '#/definitions/backend_internal_domain_model.ProjectMemberUser'
      userId:
        type: string
    type: object
  backend_internal_domain_model.ProjectMemberUser:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  backend_internal_domain_model.TrashItem:
    properties:
      daysRemaining:
        type: integer
      deletedAt:
        type: string
      deletedBy:
        $ref: '#/definitions/backend_internal_domain_model.UserAuthor'
      docId:
        type: string
      document:
        $ref: '#/definitions/backend_internal_domain_model.Document'
      id:
        type: string
    type: object
  backend_internal_domain_model.UserAuthor:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  backend_internal_domain_model.UserProfile:
    properties:
      accountNo:
        type: string
      avatarUrl:
        type: string
      bio:
        type: string
      createdAt:
        type: string
      email:
        type: string
      emailVerified:
        description: EmailVerified is read from the database, unlike the flag in the
          access token.
        type: boolean
      fullName:
        type: string
      id:
        type: string
      phoneNumber:
        type: string
      updatedAt:
        type: string
    type: object
  backend_internal_domain_model.UserSettings:
    properties:
      direction:
        type: string
      editorPrefs:
        description: JSON string
        type: string
      fontFamily:
        type: string
      language:
        type: string
      notificationPrefs:
        description: JSON string
        type: string
      theme:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  backend_internal_domain_model.UserSummary:
    properties:
      avatarUrl:
        type: string
      email:
        type: string
      fullName:
        type: string
      id:
        type: string
    type: object
  backend_internal_domain_model.Workspace:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      id:
        type: string
      logoUrl:
        type: string
      name:
        type: string
      plan:
        type: string
      role:
        description: Current user's role in this workspace
        type: string
      slug:
        type: string
      updatedAt:
        type: string
    type: object
  backend_internal_domain_model.WorkspaceMember:
    properties:
      avatarUrl:
        type: string
      email:
        type: string
      fullName:
        type: string
      joinedAt:
        type: string
      role:
        type: string
      userId:
        type: string
      workspaceId:
        type: string
    type: object
  backend_internal_presentation_auth_presenter.ExchangeIdentityRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  backend_internal_presentation_auth_presenter.ExchangeIdentityResponse:
    properties:
      accessToken:
        type: string
      redirect:
        type: string
      user:
        $ref: '#/definitions/backend_internal_presentation_auth_presenter.ResponseUser'
    type: object
  backend_internal_presentation_auth_presenter.LinkedIdentity:
    properties:
      email:
        type: string
      linkedAt:
        type: string
      provider:
        type: string
    type: object
  backend_internal_presentation_auth_presenter.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  backend_internal_presentation_auth_presenter.LoginResponse:
    properties:
      accessToken:
        type: string
      user:
        $ref: '#/definitions/backend_internal_presentation_auth_presenter.ResponseUser'
    type: object
  backend_internal_presentation_auth_presenter.PasswordLinkRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  backend_internal_presentation_auth_presenter.RegisterRequest:
    properties:
      email:
        type: string
      fullName:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  backend_internal_presentation_auth_presenter.ResponseUser:
    properties:
      accountNo:
        type: string
      email:
        type: string
      emailVerified:
        type: boolean
      exp:
        type: integer
      id:
        type: string
      role:
        items:
          type: string
        type: array
    type: object
  backend_internal_presentation_auth_presenter.SetPasswordRequest:
    properties:
      password:
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  backend_internal_presentation_auth_presenter.SignInMethods:
    properties:
      hasPassword:
        type: boolean
      identities:
        items:
          $ref: '#/definitions/backend_internal_presentation_auth_presenter.LinkedIdentity'
        type: array
    type: object
  backend_internal_presentation_auth_presenter.StartIdentityRequest:
    properties:
      redirect:
        type: string
    type: object
  backend_internal_presentation_auth_presenter.StartIdentityResponse:
    properties:
      authorizationUrl:
        type: string
    type: object
  backend_internal_presentation_auth_presenter.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  backend_internal_presentation_document_presenter.AddAccessRequest:
    properties:
      email:
        type: string
      level:
        type: string
    type: object
  backend_internal_presentation_document_presenter.CreateDocumentRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      content:
        type: string
      contentJSON:
        items:
          type: integer
        type: array
      isDraft:
        type: boolean
      projectId:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      type:
        type: string
      visibility:
        type: string
    type: object
  backend_internal_presentation_document_presenter.MoveRequest:
    properties:
      targetProjectId:
        type: string
    type: object
  backend_internal_presentation_document_presenter.ThumbnailsRequest:
    properties:
      thumbnail:
        type: string
      thumbnailDark:
        type: string
      thumbnailPreview:
        type: string
      thumbnailPreviewDark:
        type: string
    type: object
  backend_internal_presentation_document_presenter.UpdateDocumentRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      content:
        type: string
      isDraft:
        type: boolean
      projectId:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      visibility:
        type: string
    type: object
  backend_internal_presentation_project_presenter.AddCategoryRequest:
    properties:
      colorId:
        type: string
      name:
        type: string
    type: object
  backend_internal_presentation_project_presenter.AddMemberRequest:
    properties:
      email:
        type: string
      role:
        type: string
    type: object
  backend_internal_presentation_project_presenter.CreateProjectRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      colorBadge:
        type: string
      description:
        type: string
      logoUrl:
        type: string
      name:
        type: string
      visibility:
        type: string
    type: object
  backend_internal_presentation_project_presenter.ReorderCategoriesRequest:
    properties:
      categoryIds:
        items:
          type: string
        type: array
    type: object
  backend_internal_presentation_project_presenter.UpdateCategoryRequest:
    properties:
      colorId:
        type: string
      name:
        type: string
    type: object
  backend_internal_presentation_project_presenter.UpdateProjectRequest:
    properties:
      colorBadge:
        type: string
      description:
        type: string
      logoUrl:
        type: string
      name:
        type: string
      visibility:
        type: string
    type: object
  backend_internal_presentation_response.Envelope:
    properties:
      data: {}
    type: object
  backend_internal_presentation_response.ErrorEnvelope:
    properties:
      code:
        description: Code is a stable machine-readable reason, set only where a client
          acts on it.
        type: string
      title:
        type: string
    type: object
  backend_internal_presentation_user_presenter.UpdateProfileRequest:
    properties:
      bio:
        type: string
      fullName:
        type: string
      phoneNumber:
        type: string
    type: object
  backend_internal_presentation_user_presenter.UpdateSettingsRequest:
    properties:
      direction:
        type: string
      editorPrefs:
        items:
          type: integer
        type: array
      fontFamily:
        type: string
      language:
        type: string
      notificationPrefs:
        items:
          type: integer
        type: array
      theme:
        type: string
    type: object
  backend_internal_presentation_workspace_presenter.AddMemberRequest:
    properties:
      email:
        type: string
      role:
        type: string
    required:
    - email
    type: object
  backend_internal_presentation_workspace_presenter.CreateWorkspaceRequest:
    properties:
      logoUrl:
        type: string
      name:
        type: string
      plan:
        type: string
    required:
    - name
    type: object
  backend_internal_presentation_workspace_presenter.UpdateWorkspaceRequest:
    properties:
      logoUrl:
        type: string
      name:
        type: string
      plan:
        type: string
    type: object
  internal_presentation_document_handler.createNamedRevisionRequest:
    properties:
      title:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for Dokudocs backend service.
  title: Dokudocs API
  version: "1.0"
paths:
  /auth/email/resend:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Send the email verification link again
      tags:
      - Auth
  /auth/email/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Link token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_presentation_auth_presenter.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/backend_internal_presentation_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/backend_internal_presentation_auth_presenter.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      summary: Verify an email address
      tags:
      - Auth
  /auth/google/callback:
    get:
      responses:
        "302":
          description: Found
      summary: Provider callback
      tags:
      - Auth
  /auth/google/exchange:
    post:
      consumes:
      - application/json
      parameters:
      - description: Code from the callback redirect
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_presentation_auth_presenter.ExchangeIdentityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/backend_internal_presentation_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/backend_internal_presentation_auth_presenter.ExchangeIdentityResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      summary: Exchange the sign-in code for a token
      tags:
      - Auth
  /auth/google/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: Where to return
        in: body
        name: request
        schema:
          $ref: '#/definitions/backend_internal_presentation_auth_presenter.StartIdentityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/backend_internal_presentation_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/backend_internal_presentation_auth_presenter.StartIdentityResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      summary: Start signing in with an outside provider
      tags:
      - Auth
  /auth/identities:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/backend_internal_presentation_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/backend_internal_presentation_auth_presenter.SignInMethods'
              type: object
      security:
      - BearerAuth: []
      summary: List sign-in methods
      tags:
      - Auth
  /auth/identities/{provider}:
    delete:
      parameters:
      - description: Provider name
        in: path
        name: provider
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Unlink an account
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with credentials and return JWT token
      parameters:
      - description: Login request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_presentation_auth_presenter.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/backend_internal_presentation_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/backend_internal_presentation_auth_presenter.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      summary: User login
      tags:
      - Auth
  /auth/me:
    get:
      description: Retrieve current user info from JWT claims
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/backend_internal_presentation_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/backend_internal_presentation_auth_presenter.ResponseUser'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Link token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_presentation_auth_presenter.SetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Set or change the password
      tags:
      - Auth
  /auth/password/check:
    post:
      consumes:
      - application/json
      parameters:
      - description: Link token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_presentation_auth_presenter.PasswordLinkRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Check a set-password link
      tags:
      - Auth
  /auth/password/link:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Send the set-password link
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email, password, and full name
      parameters:
      - description: Register request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_presentation_auth_presenter.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/backend_internal_presentation_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/backend_internal_presentation_auth_presenter.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      summary: User registration
      tags:
      - Auth
  /avatars/{key}:
    get:
      parameters:
      - description: Avatar key
        in: path
        name: key
        required: true
        type: string
      produces:
      - image/png
      - image/jpeg
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
      summary: Fetch an avatar
      tags:
      - User
  /catalog:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.Envelope'
        "304":
          description: Not Modified
      security:
      - BearerAuth: []
      summary: List the Architecture catalog
      tags:
      - Catalog
  /catalog/requests:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_presentation_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
