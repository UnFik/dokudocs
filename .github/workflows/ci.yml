name: CI

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  collab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collab/package-lock.json

      - name: Collaboration service typecheck and tests
        working-directory: collab
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          npm ci
          npm run typecheck
          npm test

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: bun run lint

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The PDF converter runs as production does (image and flags are read from
      # docker-compose.yaml), on the host network so it can reach the listeners the
      # isolation tests open. The second one has no protection: it is the control that
      # shows those tests would notice a page reaching out.
      - name: Start the PDF converter
        run: |
          image=$(python3 -c "import yaml; print(yaml.safe_load(open('docker-compose.yaml'))['services']['gotenberg']['image'])")
          mapfile -t flags < <(python3 -c "import yaml; print('\n'.join(yaml.safe_load(open('docker-compose.yaml'))['services']['gotenberg']['command'][1:]))")
          docker run -d --name pdf-converter --network host "$image" gotenberg --api-port=3911 "${flags[@]}"
          docker run -d --name pdf-converter-open --network host "$image" gotenberg --api-port=3912
          for port in 3911 3912; do
            curl --retry 30 --retry-delay 1 --retry-connrefused -fsS "http://127.0.0.1:$port/health" > /dev/null
          done
          echo "PDF_RENDER_URL=http://127.0.0.1:3911" >> "$GITHUB_ENV"
          echo "PDF_RENDER_UNPROTECTED_URL=http://127.0.0.1:3912" >> "$GITHUB_ENV"

      - name: Backend unit and PostgreSQL integration tests
        run: make test-backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Chromium for Vitest
        working-directory: frontend
        run: bun run test:browser:install

      - name: Frontend format check
        continue-on-error: true
        working-directory: frontend
        run: bun run format:check

      - name: Frontend domain and workspace browser tests
        working-directory: frontend
        run: >-
          bun run test -- src/lib/domain-api.test.ts
          src/features/dashboard/hooks/use-dokudocs.test.tsx
          src/components/layout/create-workspace-dialog.test.tsx
          src/features/docs/components/create-doc-dialog.test.tsx

      - name: Frontend Muya and local editor browser tests
        working-directory: frontend
        run: bun run test:muya

      - name: Full frontend browser suite (baseline advisory)
        continue-on-error: true
        working-directory: frontend
        run: bun run test

      - name: Frontend build
        working-directory: frontend
        run: bun run build

  canvas-perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Chromium for Vitest
        working-directory: frontend
        run: bun run test:browser:install

      - name: Architecture canvas drag benchmark
        working-directory: frontend
        run: bun run test:perf

      - name: Write the benchmark table to the log and the job summary
        if: always()
        shell: bash
        working-directory: frontend
        run: bun scripts/canvas-perf-summary.ts perf-results.json | tee -a "$GITHUB_STEP_SUMMARY"

  e2e-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend and E2E dependencies
        run: |
          cd frontend && bun install --frozen-lockfile
          cd ../e2e && bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run live browser smoke against disposable PostgreSQL
        run: make test-e2e-smoke

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend and E2E dependencies
        run: |
          cd frontend && bun install --frozen-lockfile
          cd ../e2e && bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run full API and UI E2E against disposable PostgreSQL
        run: make test-e2e-all

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-${{ github.run_id }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
