name: dokudocs

# Production stack behind Cloudflare Tunnel: http://127.0.0.1:8088.
# Copy .env.production.example to .env and fill in the required values.
# Development: docker compose -f docker-compose.dev.yaml up --build -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dokudocs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dokudocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: prod
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-dokudocs}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    command: migrate up
    restart: "no"

  api:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /app
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-dokudocs}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGIN: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_ANSWER_MODEL: ${RAG_ANSWER_MODEL:-gpt-5-mini}
      RAG_REQUEST_TIMEOUT: ${RAG_REQUEST_TIMEOUT:-120s}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-24h}
      # Uploaded files live in their own volume, not in the bind-mounted source tree.
      ASSET_DIR: /var/lib/dokudocs/assets
      READ_TIMEOUT: ${READ_TIMEOUT:-5s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-10s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      COLLAB_SERVICE_SECRET: ${COLLAB_SERVICE_SECRET:?Set COLLAB_SERVICE_SECRET in .env}
      COLLAB_SERVICE_URL: http://collab:1234
      # Internal only: Alloy scrapes it; it is not published and not behind nginx.
      METRICS_ADDR: :9091
      # Set to http://alloy:4318 with the observability profile on (docs/observability.md).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - assets:/var/lib/dokudocs/assets
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  collab:
    build:
      context: .
      dockerfile: collab/Dockerfile
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      COLLAB_BACKEND_URL: http://api:8080
      COLLAB_SERVICE_SECRET: ${COLLAB_SERVICE_SECRET:?Set COLLAB_SERVICE_SECRET in .env}
      COLLAB_PORT: "1234"
      REDIS_URL: redis://redis:6379/1
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
      collab:
        condition: service_healthy

  # Sends logs, metrics and traces to Grafana Cloud. Off unless started with
  # --profile observability; see docs/observability.md.
  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [observability]
    restart: unless-stopped
    mem_limit: 512m
    # Sees every container's cgroup, not only its own, for per-container usage.
    cgroup: host
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:-}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:-}
      GRAFANA_CLOUD_OTLP_URL: ${GRAFANA_CLOUD_OTLP_URL:-}
      GRAFANA_CLOUD_OTLP_USER: ${GRAFANA_CLOUD_OTLP_USER:-}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Read-only: finds the containers and reads their logs and usage (Docker and
      # its containerd), and the host's CPU, memory, disk and network.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /run/udev/data:/run/udev/data:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /var/lib/docker:/var/lib/docker:ro

# Reuse the volumes created by backend/docker-compose.yaml so existing dev data carries over.
volumes:
  assets:
  postgres_data:
    name: backend_postgres_data
  alloy_data:
