name: dokudocs

# Every ${VAR:-default} can be overridden from the shell or a root .env file.
# Secrets (GOOGLE_*, OPENAI_API_KEY) default to empty; JWT_SECRET and COLLAB_SERVICE_SECRET are dev-only values.
#
#   make up                        # db, redis, migrate, api, collab, frontend (STACK=dev, the default)
#   open http://localhost:5173
#
# Without make: docker compose -f docker-compose.dev.yaml up --build
#
# The browser only talks to the frontend (:5173): it proxies /api to the API and /collab to the collaboration service.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dokudocs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dokudocs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dokudocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dokudocs-redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: dev
    container_name: dokudocs-migrate
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dokudocs}?sslmode=disable
    volumes:
      - ./backend:/app
      - go_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    command: go run ./cmd/migrate up
    restart: "no"

  api:
    build:
      context: ./backend
      target: dev
    container_name: dokudocs-api
    working_dir: /app
    environment:
      APP_ADDR: ${APP_ADDR:-:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dokudocs}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_ANSWER_MODEL: ${RAG_ANSWER_MODEL:-gpt-5-mini}
      RAG_REQUEST_TIMEOUT: ${RAG_REQUEST_TIMEOUT:-120s}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-24h}
      # Uploaded files live in their own volume, not in the bind-mounted source tree.
      ASSET_DIR: /var/lib/dokudocs/assets
      READ_TIMEOUT: ${READ_TIMEOUT:-5s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-10s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      COLLAB_SERVICE_SECRET: ${COLLAB_SERVICE_SECRET:-dev-collab-secret}
      COLLAB_SERVICE_URL: http://collab:1234
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - assets:/var/lib/dokudocs/assets
      - go_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: go run ./cmd/server

  collab:
    build:
      context: .
      dockerfile: collab/Dockerfile
    container_name: dokudocs-collab
    restart: unless-stopped
    environment:
      COLLAB_BACKEND_URL: http://api:8080
      COLLAB_SERVICE_SECRET: ${COLLAB_SERVICE_SECRET:-dev-collab-secret}
      COLLAB_PORT: "1234"
      REDIS_URL: redis://redis:6379/1
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: dokudocs-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
      COLLAB_PROXY_TARGET: ${COLLAB_PROXY_TARGET:-http://collab:1234}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # node_modules lives in this volume, not in the bind-mounted source, so it
      # keeps the packages of the image it was created from. Installing on every
      # start brings it up to bun.lock after a pull adds a dependency.
      - /app/node_modules
    depends_on:
      - api
      - collab
    command: sh -c "bun install --frozen-lockfile && exec bun run dev --host"

# Reuse the volumes created by backend/docker-compose.yaml so existing dev data carries over.
volumes:
  assets:
  postgres_data:
    name: backend_postgres_data
  go_cache:
    name: backend_go_cache
  go_build_cache:
    name: backend_go_build_cache
