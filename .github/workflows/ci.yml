name: CI

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Backend unit and PostgreSQL integration tests
        run: make test-backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Chromium for Vitest
        working-directory: frontend
        run: bun run test:browser:install

      - name: Frontend format check
        continue-on-error: true
        working-directory: frontend
        run: bun run format:check

      - name: Frontend lint (baseline advisory)
        continue-on-error: true
        working-directory: frontend
        run: bun run lint

      - name: Frontend domain and workspace browser tests
        working-directory: frontend
        run: >-
          bun run test -- src/lib/domain-api.test.ts
          src/features/dashboard/hooks/use-dokudocs.test.tsx
          src/components/layout/create-workspace-dialog.test.tsx
          src/features/docs/components/create-doc-dialog.test.tsx

      - name: Frontend Muya and local editor browser tests
        working-directory: frontend
        run: bun run test:muya

      - name: Full frontend browser suite (baseline advisory)
        continue-on-error: true
        working-directory: frontend
        run: bun run test

      - name: Frontend build
        working-directory: frontend
        run: bun run build

  e2e-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend and E2E dependencies
        run: |
          cd frontend && bun install --frozen-lockfile
          cd ../e2e && bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run live browser smoke against disposable PostgreSQL
        run: make test-e2e-smoke

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend and E2E dependencies
        run: |
          cd frontend && bun install --frozen-lockfile
          cd ../e2e && bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run full API and UI E2E against disposable PostgreSQL
        run: make test-e2e-all

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-${{ github.run_id }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  collab-load:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: WebSocket collaboration load gate (regression guard on a shared runner)
        run: make test-backend-load
