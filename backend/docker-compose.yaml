services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dokudocs-postgres
    environment:
      POSTGRES_DB: dokudocs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dokudocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dokudocs-redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    container_name: dokudocs-api
    working_dir: /app
    env_file:
      - .env.example
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/dokudocs?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      COLLAB_SERVICE_SECRET: ${COLLAB_SERVICE_SECRET:-dev-collab-secret}
      COLLAB_SERVICE_URL: http://collab:1234
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: go run ./cmd/server

  collab:
    build:
      context: ..
      dockerfile: collab/Dockerfile
    container_name: dokudocs-collab
    environment:
      COLLAB_BACKEND_URL: http://api:8080
      COLLAB_SERVICE_SECRET: ${COLLAB_SERVICE_SECRET:-dev-collab-secret}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    depends_on:
      - api
      - redis

volumes:
  postgres_data:
  go_cache:
  go_build_cache:
