# One JSON line per request for the log collector. The query string is left out
# and a share token in the path is hidden.
map $http_cf_connecting_ip $client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

map $request_uri $request_path {
    "~^(?<path>[^?]*)" $path;
}

map $request_path $log_path {
    "~^(?<before>.*/public/documents/)[^/]+(?<after>.*)$" "${before}[REDACTED]${after}";
    default $request_path;
}

map $http_traceparent $trace_id {
    "~^[0-9a-f]{2}-(?<id>[0-9a-f]{32})-" $id;
    default "";
}

map $status $log_level {
    "~^5" "ERROR";
    default "INFO";
}

log_format json escape=json
    '{"time":"$time_iso8601","level":"$log_level","msg":"request",'
    '"method":"$request_method","path":"$log_path","status":$status,'
    '"duration_s":$request_time,"bytes":$body_bytes_sent,'
    '"client_ip":"$client_ip","user_agent":"$http_user_agent","trace_id":"$trace_id"}';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log json;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/v1/auth/ {
        access_log off;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # The collaboration service (Hocuspocus) speaks WebSocket on the same origin.
    location /collab {
        proxy_pass http://collab:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /auth/callback {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
